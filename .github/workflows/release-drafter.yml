name: Release Drafter

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      # Publishing the release is what uploads to PyPI, and the package's version comes from
      # pyproject.toml, not from the tag. So the draft is named after pyproject.toml's version
      # whenever that one hasn't been released yet; until the bump lands, Release Drafter
      # works the next version out from the pull requests' labels instead.
      - name: Read the next version from pyproject.toml
        id: version
        run: |
          version="$(sed -n -E 's/^version = "(.*)"/\1/p' pyproject.toml | head -n 1)"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.version.outputs.version }}
